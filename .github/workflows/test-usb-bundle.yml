name: Verify USB audio apply recovery
on:
  push:
    branches: [test/rtl8812bu-boot-retry]
    paths:
      - '.github/workflows/test-usb-bundle.yml'
      - 'bundle/**'
      - 'package/**'
      - 'tests/**'
      - 'build_package.py'
      - 'build_usb_bundle.py'
      - 'build_wireless_mod.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
